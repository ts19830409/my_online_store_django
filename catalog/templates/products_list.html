{% extends 'base.html' %}
{% block content %}
{% load tags%}
<div class="row text-center gx-4 gy-4">
    {% for product in products%}
    <div class="col-3">
        <div class="card">
            <img src="{{ product.photo | media_filter }}">
            <div class="card-body">
                <h5 class="card-title">{{ product.name }}</h5>
                <p class="card-text">{{ product.description|truncatechars:100 }}</p>
                <a href="{% url 'catalog:products_detail' product.pk %}" class="card-link">Посмотреть</a>
                <a href="#" class="card-link">Купить</a>
            </div>
        </div>
    </div>
    {% endfor %}
    {% endblock %}
