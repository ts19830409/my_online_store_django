{% extends 'products/base.html' %}
{% block content %}
{% load tags%}


<div class="card mb-3" style="max-width: 540px;">
    <div class="row g-0">
        <div class="col-md-4">
            <img src="{{ product.photo | media_filter }}" class="img-fluid" alt="{{ product.name }}">
        </div>
        <div class="col-md-8">
            <div class="card-body">
                <h5 class="card-title">Действительно хотите удалить {{ object.name }}?</h5>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-danger">Удалить</button>
                    <a href="{% url 'catalog:product_list' %}" class="btn btn-secondary">Отмена</a>
            </div>
        </div>
    </div>
</div>


{% endblock %}
