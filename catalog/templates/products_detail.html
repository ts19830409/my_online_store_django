{% extends 'base.html' %}
{% block content %}
{% load tags%}


<div class="card mb-3" style="max-width: 540px;">
  <div class="row g-0">
    <div class="col-md-4">
      <img src="{{ product.photo | media_filter }}" class="img-fluid" alt="{{ product.name }}">
    </div>
    <div class="col-md-8">
      <div class="card-body">
        <h5 class="card-title">{{ product.name }}</h5>
        <p class="card-text">{{ product.description }}</p>
        <button type="button" class="btn btn-lg btn-block btn-outline-primary">Купить</button>
      </div>
    </div>
  </div>
</div>



 {% endblock %}
