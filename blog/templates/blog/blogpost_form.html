{% extends 'blog/base.html' %}
{% block content %}

<div class="row">
    <div class="col-md-8 mx-auto">
        <h1>
            {% if object %}
                Редактировать статью
            {% else %}
                Добавить статью
            {% endif %}
        </h1>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="mb-3">
                <label for="{{ form.title.id_for_label }}" class="form-label">Заголовок</label>
                <input type="text"
                       name="{{ form.title.name }}"
                       id="{{ form.title.id_for_label }}"
                       class="form-control"
                       value="{{ form.title.value|default:'' }}"
                       required>
            </div>

            <div class="mb-3">
                <label for="{{ form.content.id_for_label }}" class="form-label">Содержимое</label>
                <textarea name="{{ form.content.name }}"
                          id="{{ form.content.id_for_label }}"
                          class="form-control"
                          rows="10"
                          required>{{ form.content.value|default:'' }}</textarea>
            </div>

            <div class="mb-3">
                <label for="{{ form.preview.id_for_label }}" class="form-label">Превью (изображение)</label>
                {% if object.preview %}
                    <div class="mb-2">
                        <img src="{{ object.preview.url }}" class="img-thumbnail" style="max-width: 200px;">
                    </div>
                {% endif %}
                <input type="file"
                       name="{{ form.preview.name }}"
                       id="{{ form.preview.id_for_label }}"
                       class="form-control">
            </div>

            <div class="mb-3 form-check">
                <input type="checkbox"
                       name="{{ form.is_published.name }}"
                       id="{{ form.is_published.id_for_label }}"
                       class="form-check-input"
                       {% if form.is_published.value %}checked{% endif %}>
                <label for="{{ form.is_published.id_for_label }}" class="form-check-label">
                    Опубликовать
                </label>
            </div>

            <button type="submit" class="btn btn-primary">Сохранить</button>
            <a href="{% url 'blog:list' %}" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
</div>

{% endblock %}
